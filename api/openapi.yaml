  schemas:
    SigningRequest:
      type: object
      required: [id, title, fileName, status, pages, fields, revision, signerName, signerEmail, createdAt, updatedAt, originalSHA256, events]
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,64}$'
        title:
          type: string
          maxLength: 160
        fileName:
          type: string
        status:
          type: string
          enum: [draft, pending, completed, revoked]
          description: Expiry is derived from expiresAt and does not change the stored status.
        pages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [width, height]
            properties:
              width:
                type: number
                minimum: 72
                maximum: 2880
                description: Original page width in PDF points.
              height:
                type: number
                minimum: 72
                maximum: 2880
                description: Original page height in PDF points.
        fields:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SigningField'
        revision:
          type: integer
          minimum: 1
        signerName:
          type: string
          maxLength: 120
          description: Sender-supplied recipient name, retained after completion. Empty in drafts.
        completedSignerName:
          type: string
          maxLength: 120
          description: Self-reported name entered by the signer at completion.
        signerEmail:
          type: string
          maxLength: 254
          description: Sender-supplied email address, unverified. Empty in drafts.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        originalSHA256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the immutable prepared PDF on which signing fields are placed. Equal to the upload hash when no preparation was needed.
        uploadedSHA256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the raw uploaded bytes. Equal to originalSHA256 when preparation was unnecessary; absent on requests created before automatic preparation was introduced.
        flattened:
          type: boolean
          description: True when the upload was converted to a static page-image PDF. Converted body text is not selectable.
        signedSHA256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the complete signed PDF including its signing record page.
        events:
          type: array
          items:
            type: object
            required: [action, at]
            properties:
              action:
                type: string
                enum: [created, link_created, revoked, completed]
              at:
                type: string
                format: date-time
        consent:
          type: string
          description: Exact electronic-signing consent recorded at completion.
    SigningField:
      type: object
      additionalProperties: false
      required: [id, type, label, page, x, y, width, height, required]
      description: Coordinates are fractions of the original page dimensions with a top-left origin. Fields must remain wholly inside their page and measure at least 20 PDF points wide and 15.6 points high. Link creation checks that the supplied recipient name and date values fit. Text uses Windows-1252 without control characters.
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,64}$'
          description: Unique within this request.
        type:
          type: string
          enum: [signature, date, name, text]
        label:
          type: string
          minLength: 1
          maxLength: 80
        page:
          type: integer
          minimum: 1
          maximum: 50
          description: One-based original PDF page number.
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        width:
          type: number
          minimum: 0.05
          maximum: 1
        height:
          type: number
          minimum: 0.015
          maximum: 1
        required:
          type: boolean
    SigningCompletion:
      type: object
      additionalProperties: false
      required: [signerName, consent, values]
      properties:
        signerName:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed self-reported full name using Windows-1252 without control characters.
        consent:
          type: boolean
          const: true
          description: 'Explicit agreement: I agree to use electronic records and signatures, have reviewed this document, and intend my signature to be binding.'
        values:
          type: object
          description: Map from field ID to trimmed value. Unknown field IDs are rejected. Date and name values are supplied by the server.
          additionalProperties:
            type: string
            maxLength: 200
    Page:
      type: object
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: string
    AcceptedJob:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          const: accepted
    IntegrationJob:
      type: object
      required: [id, type, scope, connectionId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [gmail.sync, tiller.sync, google-contact.sync]
        scope:
          type: string
        connectionId:
          type: string
        contactId:
          type: string
        action:
          type: string
          enum: [upsert, delete]
        actor:
          type: string
    GoogleContactsStatus:
      type: object
      additionalProperties: false
      required: [connected, googleEmail, connectUrl, pending, failed, synced]
      properties:
        connected:
          type: boolean
        googleEmail:
          type: string
        connectUrl:
          type: string
        pending:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        synced:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
    User:
