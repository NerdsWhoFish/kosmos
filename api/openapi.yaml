openapi: 3.1.0
info:
  title: Kosmos API
  version: 0.3.0
  description: API for the Kosmos small business workspace.
  license:
    name: MIT
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /config:
    get:
      operationId: getPublicConfig
      security: []
      responses:
        '200':
          description: Public browser runtime configuration
          content:
            application/json:
              schema:
                type: object
                required: [faroURL, faroAppName]
                properties:
                  faroURL:
                    type: string
                  faroAppName:
                    type: string
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated Google identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /modules:
    get:
      operationId: listModules
      responses:
        '200':
          description: Enabled module capabilities and navigation metadata
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /summary:
    get:
      operationId: getWorkspaceSummary
      responses:
        '200':
          description: Current workspace totals and recent activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Matching workspace records
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 25
                    items:
                      $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing:
    get:
      operationId: getLanding
      responses:
        '200':
          description: Landing zone shortcuts and notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landing'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing/buttons:
    post:
      operationId: createLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButtonInput'
      responses:
        '201':
          description: Shortcut created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Button'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing/buttons/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordID'
    patch:
      operationId: updateLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButtonInput'
      responses:
        '200':
          description: Shortcut updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Button'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Shortcut deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /contacts:
    get:
      operationId: listContacts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ContactList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contact-sources:
    get:
      operationId: listContactSources
      responses:
        '200':
          description: Organization-wide contact source choices
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactSource'
    post:
      operationId: createContactSource
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Contact source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSource'
        '400':
          $ref: '#/components/responses/BadRequest'
  /leads:
    get:
      operationId: listLeads
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/LeadList'
  /accounts:
    get:
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/AccountList'
    post:
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account and optional primary contact created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreation'
  /accounts/{id}:
    get:
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: Account with linked contacts, opportunities, and newest-first documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
    patch:
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account updated
    delete:
      operationId: deleteAccount
      description: Permanently deletes the account and its linked workspace records. Documents with other links are preserved.
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Account and linked workspace records deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{id}/events:
    get:
      operationId: listAccountEvents
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [account, contact, opportunity, email, call, text, activity, reminder, document, domain, transaction]
      responses:
        '200':
          description: Newest-first account event history
          content:
            application/json:
              schema:
                type: object
                required: [events, page]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountEvent'
                  page:
                    $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /intake/contact:
    post:
      operationId: ingestContactForm
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactIntake'
      responses:
        '201':
          description: Lead received
        '202':
          description: Duplicate or spam submission safely accepted
        '429':
          description: Per-source rate limit exceeded
  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordID'
    get:
      operationId: getContact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatch'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Contact deleted and shared Google Contacts deletion queued when connected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities:
    get:
      operationId: listOpportunities
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/OpportunityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOpportunity
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opportunities/{id}:
    patch:
      operationId: updateOpportunity
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityPatch'
      responses:
        '200':
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOpportunity
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Opportunity deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /activities:
    get:
      operationId: listActivities
      parameters:
        - name: contactId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ActivityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createActivity
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reminders:
    get:
      operationId: listReminders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ReminderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createReminder
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reminders/{id}:
    patch:
      operationId: updateReminder
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/DocumentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}:
    patch:
      operationId: updateDocument
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Document and its revision history deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{id}/revisions:
    get:
      operationId: listDocumentRevisions
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRevisionList'
  /costs:
    get:
      operationId: listCosts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/CostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createCost
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostInput'
      responses:
        '201':
          description: Cost created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /costs/{id}:
    patch:
      operationId: updateCost
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostPatch'
      responses:
        '200':
          description: Cost updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCost
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Cost and linked receipt attachments deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /members:
    get:
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/MemberList'
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Membership role or status updated
        '403':
          description: Owner or administrator role required
  /members/{id}/send-as:
    put:
      operationId: configureMemberSendAs
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verified Gmail send-as alias mapped to this member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAsMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Owner or administrator role required
        '409':
          description: Member has not connected Google Workspace
  /email/send-as:
    get:
      operationId: listSendAsMappings
      responses:
        '200':
          description: Organization Gmail sender mappings
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendAsMapping'
        '403':
          description: Owner or administrator role required
  /pipeline-stages:
    get:
      operationId: listPipelineStages
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/PipelineStageList'
    post:
      operationId: createPipelineStage
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '201':
          description: Pipeline stage created
  /notifications/{id}:
    patch:
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Notification marked read
  /events:
    post:
      operationId: publishBusinessEvent
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, kind, href]
              properties:
                title:
                  type: string
                summary:
                  type: string
                kind:
                  type: string
                href:
                  type: string
                  pattern: ^/
      responses:
        '202':
          description: Idempotent event accepted into the notification projection
  /email/templates:
    get:
      operationId: listEmailTemplates
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/EmailTemplateList'
    post:
      operationId: createEmailTemplate
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateInput'
      responses:
        '201':
          description: Email template created
  /email/templates/{id}:
    patch:
      operationId: updateEmailTemplate
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplateInput'
      responses:
        '200':
          description: Email template updated
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEmailTemplate
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Email template deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /email/send:
    post:
      operationId: sendGoogleEmail
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Email sent through the connected Google account
        '409':
          description: Google Workspace is not connected
  /email/sync:
    post:
      operationId: syncGoogleMailMetadata
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '202':
          description: Relevant inbound message metadata synchronization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
  /email/messages:
    get:
      operationId: listRelevantMail
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/MailMetadataList'
  /integrations/google:
    get:
      operationId: getGoogleConnection
      responses:
        '200':
          description: Current user's Google Workspace connection status
  /integrations/google-contacts:
    get:
      operationId: getSharedGoogleContactsConnection
      responses:
        '200':
          description: Shared Google Contacts connection and synchronization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleContactsStatus'
        '403':
          description: Owner or administrator role required
    delete:
      operationId: disconnectSharedGoogleContacts
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Shared Google Contacts account disconnected
        '403':
          description: Owner or administrator role required
  /integrations/google-contacts/sync:
    post:
      operationId: syncSharedGoogleContacts
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '202':
          description: All Kosmos contacts queued for synchronization
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, queued]
                properties:
                  status:
                    type: string
                    const: accepted
                  queued:
                    type: integer
                    minimum: 0
        '403':
          description: Owner or administrator role required
        '409':
          description: Shared Google Contacts account is not connected
  /integrations/cloudflare:
    get:
      operationId: getCloudflareConnection
      responses:
        '200':
          description: Organization Cloudflare connection status
    put:
      operationId: configureCloudflare
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudflareConnectionInput'
      responses:
        '200':
          description: Cloudflare credential validated, encrypted, and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Owner or administrator role required
        '502':
          description: Cloudflare could not validate the credential
    delete:
      operationId: disconnectCloudflare
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Cloudflare disconnected
        '403':
          description: Owner or administrator role required
  /integrations/cloudflare/domains:
    get:
      operationId: listCloudflareDomains
      responses:
        '200':
          description: Cloudflare zones merged with Registrar renewal metadata
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudflareDomain'
  /integrations/cloudflare/link:
    post:
      operationId: linkCloudflareDomain
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudflareDomainLink'
      responses:
        '200':
          description: Domain linked to account and renewal reminders ensured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareDomainLinkResult'
  /integrations/tiller:
    put:
      operationId: configureTiller
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Tiller Google Sheet configured
  /integrations/tiller/sync:
    post:
      operationId: syncTiller
      parameters:
        - $ref: '#/components/parameters/CSRF'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Idempotent Tiller import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedJob'
  /integrations/tiller/webhook:
    get:
      operationId: getTillerWebhookStatus
      responses:
        '200':
          description: Tiller purchase webhook status and destination path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillerWebhookStatus'
        '403':
          description: Owner or administrator role required
    put:
      operationId: configureTillerWebhook
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signingSecret]
              properties:
                signingSecret:
                  type: string
                  writeOnly: true
                  pattern: '^whsec_[a-fA-F0-9]{64}$'
      responses:
        '200':
          description: Tiller webhook signing secret encrypted and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillerWebhookStatus'
    delete:
      operationId: disconnectTillerWebhook
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Tiller purchase webhook disconnected
  /integrations/tiller/product-mappings:
    get:
      operationId: listTillerProductMappings
      responses:
        '200':
          description: Tiller product to Kosmos account mappings
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings:
                    type: array
                    items:
                      $ref: '#/components/schemas/TillerProductMapping'
  /integrations/tiller/product-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: configureTillerProductMapping
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId:
                  type: string
                productName:
                  type: string
                  maxLength: 160
      responses:
        '200':
          description: Tiller product mapped to a Kosmos account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillerProductMapping'
    delete:
      operationId: deleteTillerProductMapping
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Product mapping removed
  /webhooks/tiller:
    post:
      operationId: receiveTillerWebhook
      security: []
      parameters:
        - name: Tiller-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TillerEvent'
      responses:
        '204':
          description: Event authenticated and idempotently processed or ignored
        '401':
          description: Signature invalid or stale
  /transactions:
    get:
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/TransactionList'
  /transactions/{id}:
    patch:
      operationId: reviewTransactionMatch
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Transaction match reviewed
  /attachments:
    get:
      operationId: listAttachments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/AttachmentList'
    post:
      operationId: uploadAttachment
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [attachment, receipt, photo]
                recordType:
                  type: string
                recordId:
                  type: string
      responses:
        '201':
          description: Private attachment stored
  /attachments/{id}:
    delete:
      operationId: deleteAttachment
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Attachment metadata and private object deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /attachments/{id}/download:
    get:
      operationId: downloadAttachment
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment bytes
  /audit:
    get:
      operationId: listAuditHistory
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/AuditEntryList'
  /exports/{kind}:
    get:
      operationId: exportRecords
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [contacts, costs]
      responses:
        '200':
          description: Portable CSV export
          content:
            text/csv:
              schema:
                type: string
  /voice/link:
    get:
      operationId: getGoogleVoiceLinks
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [call, message]
        - name: redirect
          in: query
          description: Set to 1 to redirect through Google Account Chooser into the shared account's Voice search.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Shared-account Google Voice, native call, and native SMS links
          content:
            application/json:
              schema:
                type: object
                required: [googleVoiceUrl, googleAccount, callUrl, smsUrl]
                properties:
                  googleVoiceUrl:
                    type: string
                    format: uri
                  googleAccount:
                    type: string
                    format: email
                  callUrl:
                    type: string
                  smsUrl:
                    type: string
        '303':
          description: Redirect through Google Account Chooser to the contact's Google Voice search
        '400':
          description: Phone number is missing
        '409':
          description: Shared Google Voice account is not connected
  /jobs/schedule:
    post:
      operationId: scheduleIntegrationJobs
      description: Private Cloud Scheduler target that queues integration work for every connected account.
      security:
        - cloudRunOIDC: []
      responses:
        '202':
          description: Integration jobs queued
        '500':
          description: Connections could not be loaded
        '503':
          description: At least one integration job could not be queued
  /jobs/execute:
    post:
      operationId: executeIntegrationJob
      description: Private Cloud Tasks target that performs one idempotent provider synchronization.
      security:
        - cloudRunOIDC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationJob'
      responses:
        '200':
          description: Job completed or had already completed
        '204':
          description: Connection no longer exists and the job was safely skipped
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Provider synchronization failed and Cloud Tasks should retry
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kosmos_session
    cloudRunOIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token accepted by Cloud Run IAM.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return. Defaults to 50 and is capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the prior response page.
      schema:
        type: string
    RecordID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CSRF:
      name: X-Kosmos-CSRF
      in: header
      required: true
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: A valid, currently allowed Google session is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotificationList:
      description: Notification feed
      content:
        application/json:
          schema:
            type: object
            required: [notifications, page]
            properties:
              notifications:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
              page:
                $ref: '#/components/schemas/Page'
    ContactList:
      description: Contacts
      content:
        application/json:
          schema:
            type: object
            required: [contacts, page]
            properties:
              contacts:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
              page:
                $ref: '#/components/schemas/Page'
    LeadList:
      description: Contacts currently classified as leads
      content:
        application/json:
          schema:
            type: object
            required: [leads, page]
            properties:
              leads:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
              page:
                $ref: '#/components/schemas/Page'
    AccountList:
      description: Prospect and customer accounts
      content:
        application/json:
          schema:
            type: object
            required: [accounts, page]
            properties:
              accounts:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
              page:
                $ref: '#/components/schemas/Page'
    OpportunityList:
      description: Opportunities
      content:
        application/json:
          schema:
            type: object
            required: [opportunities, page]
            properties:
              opportunities:
                type: array
                items:
                  $ref: '#/components/schemas/Opportunity'
              page:
                $ref: '#/components/schemas/Page'
    ActivityList:
      description: Activities
      content:
        application/json:
          schema:
            type: object
            required: [activities, page]
            properties:
              activities:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
              page:
                $ref: '#/components/schemas/Page'
    ReminderList:
      description: Reminders
      content:
        application/json:
          schema:
            type: object
            required: [reminders, page]
            properties:
              reminders:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
              page:
                $ref: '#/components/schemas/Page'
    DocumentList:
      description: Documents
      content:
        application/json:
          schema:
            type: object
            required: [documents, page]
            properties:
              documents:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              page:
                $ref: '#/components/schemas/Page'
    CostList:
      description: Costs
      content:
        application/json:
          schema:
            type: object
            required: [costs, page]
            properties:
              costs:
                type: array
                items:
                  $ref: '#/components/schemas/Cost'
              page:
                $ref: '#/components/schemas/Page'
    DocumentRevisionList:
      description: Immutable prior document revisions
      content:
        application/json:
          schema:
            type: object
            required: [revisions, page]
            properties:
              revisions:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRevision'
              page:
                $ref: '#/components/schemas/Page'
    MemberList:
      description: Organization members and roles
      content:
        application/json:
          schema:
            type: object
            required: [members, page]
            properties:
              members:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
              page:
                $ref: '#/components/schemas/Page'
    PipelineStageList:
      description: Ordered organization pipeline stages
      content:
        application/json:
          schema:
            type: object
            required: [stages, page]
            properties:
              stages:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineStage'
              page:
                $ref: '#/components/schemas/Page'
    EmailTemplateList:
      description: Reusable outbound email templates
      content:
        application/json:
          schema:
            type: object
            required: [templates, page]
            properties:
              templates:
                type: array
                items:
                  $ref: '#/components/schemas/EmailTemplate'
              page:
                $ref: '#/components/schemas/Page'
    MailMetadataList:
      description: Metadata for mail from known contacts
      content:
        application/json:
          schema:
            type: object
            required: [messages, page]
            properties:
              messages:
                type: array
                items:
                  $ref: '#/components/schemas/MailMetadata'
              page:
                $ref: '#/components/schemas/Page'
    TransactionList:
      description: Imported transactions and match states
      content:
        application/json:
          schema:
            type: object
            required: [transactions, page]
            properties:
              transactions:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
              page:
                $ref: '#/components/schemas/Page'
    AttachmentList:
      description: Private attachment metadata with expiring download links
      content:
        application/json:
          schema:
            type: object
            required: [attachments, page]
            properties:
              attachments:
                type: array
                items:
                  $ref: '#/components/schemas/Attachment'
              page:
                $ref: '#/components/schemas/Page'
    AuditEntryList:
      description: Security-sensitive and externally visible changes
      content:
        application/json:
          schema:
            type: object
            required: [entries, page]
            properties:
              entries:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
              page:
                $ref: '#/components/schemas/Page'
  schemas:
    Page:
      type: object
      required: [limit, nextCursor]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: string
    AcceptedJob:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          const: accepted
    IntegrationJob:
      type: object
      required: [id, type, scope, connectionId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [gmail.sync, tiller.sync, google-contact.sync]
        scope:
          type: string
        connectionId:
          type: string
        contactId:
          type: string
        action:
          type: string
          enum: [upsert, delete]
        actor:
          type: string
    GoogleContactsStatus:
      type: object
      additionalProperties: false
      required: [connected, googleEmail, connectUrl, pending, failed, synced]
      properties:
        connected:
          type: boolean
        googleEmail:
          type: string
        connectUrl:
          type: string
        pending:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        synced:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
    User:
      type: object
      required: [subject, email, name]
      properties:
        subject:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        picture:
          type: string
          format: uri
    ModuleManifest:
      type: object
      required: [name, navigation, permissions, resources, eventTypes, backgroundJobs, searchProviders, documentLinkTargets]
      properties:
        name:
          type: string
        navigation:
          type: array
          items:
            type: object
            required: [path, label, icon]
            properties:
              path:
                type: string
              label:
                type: string
              icon:
                type: string
        permissions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        eventTypes:
          type: array
          items:
            type: string
        backgroundJobs:
          type: array
          items:
            type: string
        searchProviders:
          type: array
          items:
            type: string
        documentLinkTargets:
          type: array
          items:
            type: string
    ButtonInput:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 180
        href:
          type: string
    Button:
      allOf:
        - $ref: '#/components/schemas/ButtonInput'
        - type: object
          required: [id, icon]
          properties:
            id:
              type: string
            icon:
              type: string
    ContactSource:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      required: [id, title, summary, kind, createdAt, href]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
        href:
          type: string
        readAt:
          type: string
          format: date-time
    Landing:
      type: object
      required: [buttons, notifications]
      properties:
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/Button'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    ContactInput:
      type: object
      required: [name]
      properties:
        accountId:
          type: string
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 40
        linkedinUrl:
          type: string
          format: uri
          description: HTTPS URL for the person's LinkedIn profile.
        source:
          type: string
          maxLength: 100
    ContactIntake:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 160
        company:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
          maxLength: 5000
        source:
          type: string
        website:
          type: string
          description: Honeypot field that real users must leave empty.
    AccountInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 160
        websites:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/WebsiteInput'
        links:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AccountLink'
        billingEmail:
          type: string
          format: email
        status:
          type: string
          enum: [prospect, customer, inactive]
        notes:
          type: string
        primaryContact:
          $ref: '#/components/schemas/ContactInput'
    Account:
      allOf:
        - $ref: '#/components/schemas/AccountInput'
        - $ref: '#/components/schemas/AuditedRecord'
    AccountPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        websites:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/WebsiteInput'
        links:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AccountLink'
        billingEmail:
          type: string
          format: email
        status:
          type: string
          enum: [prospect, customer, inactive]
        notes:
          type: string
    AccountCreation:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        contact:
          oneOf:
            - $ref: '#/components/schemas/Contact'
            - type: 'null'
    AccountDetail:
      type: object
      required: [account, contacts, opportunities, documents]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/Opportunity'
        documents:
          type: array
          description: Documents linked to this account, sorted from newest to oldest by creation time.
          items:
            $ref: '#/components/schemas/Document'
    AccountEvent:
      type: object
      required: [id, accountId, kind, action, title, summary, actor, entityType, entityId, occurredAt, createdAt]
      properties:
        id:
          type: string
        accountId:
          type: string
        kind:
          type: string
