  /signing-requests:
    get:
      operationId: listSigningRequests
      description: Organization signing requests ordered newest first by creation time.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SigningRequestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/SigningFailure'
    post:
      operationId: createSigningRequest
      description: Upload one PDF as a draft. Accepts up to 10 MiB and 50 pages. Already compatible inputs remain byte-identical; other supported inputs are prepared as static page images using sandboxed PDFium at 200 DPI with JPEG quality 95. Conversion preserves visible forms and annotations but removes selectable body text and document accessibility structure. Rejects encryption, XFA, unsupported form states, and inputs exceeding parser or conversion limits. Conversion permits at most eight million pixels per page and 10 MiB output with bounded time and memory. One upload per process is admitted before buffering its body; a busy process returns 429 with Retry-After 1. Prepared page dimensions must be 1 to 40 inches. Limited to 20 uploads per organization per minute.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, file]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Trimmed title using Windows-1252 characters without control characters.
                file:
                  type: string
                  format: binary
                  description: One PDF of at most 10485760 bytes.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '201':
          $ref: '#/components/responses/SigningRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/SigningRateLimited'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordID'
    get:
      operationId: getSigningRequest
      responses:
        '200':
          $ref: '#/components/responses/SigningRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/SigningFailure'
    put:
      operationId: editSigningRequest
      description: Replace every field on a draft using its current revision. Fields become immutable when a signing link is created. Supports at most 100 fields and a 128 KiB JSON body.
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, fields]
              properties:
                revision:
                  type: integer
                  minimum: 1
                fields:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SigningField'
      responses:
        '200':
          $ref: '#/components/responses/SigningRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing-requests/{id}/link:
    post:
      operationId: createSigningLink
      description: Lock a draft with at least one required signature field and return its signing link once. The recipient email is supplied by the sender and is not verified. Does not send email. Link possession grants access and links can be forwarded. A lost link requires a new request.
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, signerName, signerEmail, expiresDays]
              properties:
                revision:
                  type: integer
                  minimum: 1
                signerName:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Trimmed Windows-1252 text without control characters.
                signerEmail:
                  type: string
                  format: email
                  maxLength: 254
                  description: Bare email address, without display name.
                expiresDays:
                  type: integer
                  minimum: 1
                  maximum: 90
      responses:
        '200':
          description: Locked request and one-time relative signing URL
          content:
            application/json:
              schema:
                type: object
                required: [request, signingUrl]
                properties:
                  request:
                    $ref: '#/components/schemas/SigningRequest'
                  signingUrl:
                    type: string
                    format: uri-reference
                    description: 'Relative /sign URL with a fragment containing request-id.token. Resolve against the Kosmos origin and share the entire fragment. Never put the token in a query or path, logs, or telemetry.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing-requests/{id}/revoke:
    post:
      operationId: revokeSigningRequest
      description: Irreversibly revoke a draft or pending request using its current revision. Completed requests cannot be revoked.
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/SigningRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing-requests/{id}/pdf:
    get:
      operationId: downloadSigningPDF
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CompletedPDF'
        - $ref: '#/components/parameters/UploadedPDF'
      responses:
        '200':
          $ref: '#/components/responses/SigningPDF'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing/{id}:
    get:
      operationId: getPublicSigningRequest
      description: Read a pending or completed request using its possession token. Completed requests remain accessible until link expiry. Authenticated workspace credentials do not replace this token.
      security:
        - signingToken: []
      parameters:
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          $ref: '#/components/responses/SigningRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SigningUnavailable'
        '429':
          $ref: '#/components/responses/SigningRateLimited'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing/{id}/pdf:
    get:
      operationId: downloadPublicSigningPDF
      description: Download the prepared signing copy or completed artifact. Raw uploaded bytes are private; uploaded=true is rejected with 400.
      security:
        - signingToken: []
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CompletedPDF'
      responses:
        '200':
          $ref: '#/components/responses/SigningPDF'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '410':
          $ref: '#/components/responses/SigningUnavailable'
        '429':
          $ref: '#/components/responses/SigningRateLimited'
        '500':
          $ref: '#/components/responses/SigningFailure'
  /signing/{id}/complete:
    post:
      operationId: completeSigningRequest
      description: Submit explicit consent and typed field values. Dates use the server's current UTC date and name fields use signerName, overriding supplied field values. Required fields must be nonblank and all values must fit their fields at a readable size. Checks the original PDF hash, renders fields and a signing record page, and atomically claims completion. Concurrent completions and later retries return the winning completed request while the link remains valid. A revoked or expired link cannot complete. Supports a 64 KiB JSON body.
      security:
        - signingToken: []
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/SigningCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningCompletion'
      responses:
        '200':
          $ref: '#/components/responses/SigningRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SigningConflict'
        '410':
          $ref: '#/components/responses/SigningUnavailable'
        '429':
          $ref: '#/components/responses/SigningRateLimited'
        '500':
          $ref: '#/components/responses/SigningFailure'
components:
  securitySchemes:
    signingToken:
      type: apiKey
      in: header
      name: X-Kosmos-Signing-Token
      description: Exactly one header containing the 43-character base64url HMAC-SHA256 token from the signing URL fragment. Public signing requires this token independently of session cookies and workflow API credentials. The server verifies its HMAC before database access, then verifies its stored SHA-256 hash and request state. Integration-key rotation invalidates every existing signing link.
    sessionCookie:
      type: apiKey
      in: cookie
      name: kosmos_session
    apiCredential:
      type: http
      scheme: bearer
      bearerFormat: Kosmos API credential
      description: One-time Kosmos API token created by an owner or administrator in Settings.
    cloudRunOIDC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC token accepted by Cloud Run IAM.
  parameters:
    CompletedPDF:
      name: completed
      in: query
      required: false
      description: Set to true to download the completed PDF with its signing record page. Otherwise returns the prepared signing copy. Returns 409 if completion is requested before signing. Cannot be combined with uploaded=true.
      schema:
        type: boolean
        default: false
    UploadedPDF:
      name: uploaded
      in: query
      required: false
      description: Set to true for an authenticated download of the raw uploaded PDF, including before automatic preparation. Cannot be combined with completed=true. Public signing downloads reject uploaded=true with 400.
      schema:
        type: boolean
        default: false
    SigningCSRF:
      name: X-Kosmos-CSRF
      in: header
      required: true
      description: Required alongside the signing token for public completion.
      schema:
        type: string
        const: '1'
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return. Defaults to 50 and is capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the prior response page.
      schema:
        type: string
    RecordID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CSRF:
      name: X-Kosmos-CSRF
      in: header
      required: false
      description: Required with value 1 for browser session mutations. Bearer-authenticated requests do not use browser CSRF protection.
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  responses:
    SigningRequest:
      description: Signing request without storage object paths, creator identity, or token hash. Responses use Cache-Control private, no-store and Referrer-Policy no-referrer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SigningRequest'
    SigningRequestList:
      description: Organization signing requests, newest first
      content:
        application/json:
          schema:
            type: object
            required: [requests, page]
            properties:
              requests:
                type: array
                items:
                  $ref: '#/components/schemas/SigningRequest'
              page:
                $ref: '#/components/schemas/Page'
    SigningPDF:
      description: Private PDF download, with Content-Disposition attachment and Cache-Control private, no-store. The completed artifact includes an electronic signing record, not a PKI digital signature.
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    SigningConflict:
      description: Stale revision, incompatible state, or requested completed PDF unavailable. Reload the request before continuing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SigningUnavailable:
      description: Correct token presented for an expired or revoked request. Ask the sender for a new request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SigningRateLimited:
      description: Shared quota exceeded or this process is already handling an upload. Uploads allow 20 per organization per minute and one concurrent upload per process; a busy process returns Retry-After 1 before buffering the body. Public reads, downloads, and completions share 120 per request per minute, and pending completions additionally allow 10 attempts per request per minute.
      headers:
        Retry-After:
          description: Seconds until the quota can be retried.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SigningFailure:
      description: Signing storage or processing dependency failed. Retry after inspecting request state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: A valid Google session or API credential is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated identity does not have access to this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    APICredentialList:
      description: Organization API credentials without secret hashes or plaintext tokens
      content:
        application/json:
          schema:
            type: object
            required: [credentials, page]
            properties:
              credentials:
