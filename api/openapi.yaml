openapi: 3.1.0
info:
  title: Kosmos API
  version: 0.3.5
  description: API for the Kosmos small business workspace.
  license:
    name: MIT
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - apiCredential: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    const: ok
                  version:
                    type: string
  /config:
    get:
      operationId: getPublicConfig
      security: []
      responses:
        '200':
          description: Public browser runtime configuration
          content:
            application/json:
              schema:
                type: object
                required: [faroURL, faroAppName, faroVersion]
                properties:
                  faroURL:
                    type: string
                  faroAppName:
                    type: string
                  faroVersion:
                    type: string
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated Google identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /modules:
    get:
      operationId: listModules
      responses:
        '200':
          description: Enabled module capabilities and navigation metadata
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModuleManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /summary:
    get:
      operationId: getWorkspaceSummary
      responses:
        '200':
          description: Current workspace totals and recent activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Matching workspace records
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 25
                    items:
                      $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing:
    get:
      operationId: getLanding
      responses:
        '200':
          description: Landing zone shortcuts and notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landing'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing/buttons:
    post:
      operationId: createLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButtonInput'
      responses:
        '201':
          description: Shortcut created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Button'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landing/buttons/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordID'
    patch:
      operationId: updateLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButtonInput'
      responses:
        '200':
          description: Shortcut updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Button'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteLandingButton
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Shortcut deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
  /contacts:
    get:
      operationId: listContacts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ContactList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contact-sources:
    get:
      operationId: listContactSources
      responses:
        '200':
          description: Organization-wide contact source choices
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContactSource'
    post:
      operationId: createContactSource
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Contact source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSource'
        '400':
          $ref: '#/components/responses/BadRequest'
  /leads:
    get:
      operationId: listLeads
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/LeadList'
  /accounts:
    get:
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/AccountList'
    post:
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account and optional primary contact created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreation'
  /accounts/{id}:
    get:
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/RecordID'
      responses:
        '200':
          description: Account with linked contacts, opportunities, and newest-first documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
    patch:
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account updated
    delete:
      operationId: deleteAccount
      description: Permanently deletes the account and its linked workspace records. Documents with other links are preserved.
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Account and linked workspace records deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{id}/events:
    get:
      operationId: listAccountEvents
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [account, contact, opportunity, email, call, text, activity, reminder, document, domain, transaction]
      responses:
        '200':
          description: Newest-first account event history
          content:
            application/json:
              schema:
                type: object
                required: [events, page]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountEvent'
                  page:
                    $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /intake/contact:
    post:
      operationId: ingestContactForm
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactIntake'
      responses:
        '201':
          description: Lead received
        '202':
          description: Inquiry retained for an existing contact, or spam submission ignored
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Per-source rate limit exceeded
        '503':
          description: Rate limit storage unavailable
  /contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordID'
    get:
      operationId: getContact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPatch'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteContact
      parameters:
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Contact deleted and shared Google Contacts deletion queued when connected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities:
    get:
      operationId: listOpportunities
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/OpportunityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createOpportunity
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '201':
          description: Opportunity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opportunities/{id}:
    patch:
      operationId: updateOpportunity
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityPatch'
      responses:
        '200':
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOpportunity
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Opportunity deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /activities:
    get:
      operationId: listActivities
      parameters:
        - name: contactId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ActivityList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createActivity
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reminders:
    get:
      operationId: listReminders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ReminderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createReminder
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderInput'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reminders/{id}:
    patch:
      operationId: updateReminder
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/DocumentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createDocument
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}:
    patch:
      operationId: updateDocument
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '409':
          description: The expected revision is stale; reload the latest document before merging the draft
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Document and its revision history deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{id}/revisions:
    get:
      operationId: listDocumentRevisions
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRevisionList'
  /managed-documents/{sourceKey}:
    put:
      operationId: syncManagedDocument
      description: Idempotently create or update one managed document and reconcile its complete attachment set by filename.
      security:
        - apiCredential: []
      parameters:
        - name: sourceKey
          in: path
          required: true
          description: Stable source key using letters, numbers, dots, underscores, or hyphens.
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties:
                document:
                  type: string
                  description: JSON object with title, body, and optional links. Relative Markdown links resolve to attachments by URL-path basename.
                files:
                  type: array
                  description: Complete desired attachment set. Duplicate basenames are rejected and omitted prior attachments are removed.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Existing managed document converged to the supplied state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDocumentResult'
        '201':
          description: Managed document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDocumentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /costs:
    get:
      operationId: listCosts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/CostList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createCost
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostInput'
      responses:
        '201':
          description: Cost created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /costs/{id}:
    patch:
      operationId: updateCost
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostPatch'
      responses:
        '200':
          description: Cost updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cost'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCost
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Cost and linked receipt attachments deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api-credentials:
    get:
      operationId: listAPICredentials
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/APICredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAPICredential
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, access]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                access:
                  type: string
                  enum: [read, write]
      responses:
        '201':
          description: Credential created and plaintext token returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APICredentialCreation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api-credentials/{id}:
    delete:
      operationId: revokeAPICredential
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Credential revoked or already revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /members:
    get:
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/MemberList'
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Membership role or status updated
        '403':
          description: Owner or administrator role required
  /members/{id}/send-as:
    put:
      operationId: configureMemberSendAs
      parameters:
        - $ref: '#/components/parameters/RecordID'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verified Gmail send-as alias mapped to this member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAsMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Owner or administrator role required
        '409':
          description: Member has not connected Google Workspace
  /email/send-as:
    get:
      operationId: listSendAsMappings
      responses:
        '200':
          description: Organization Gmail sender mappings
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendAsMapping'
        '403':
          description: Owner or administrator role required
  /pipeline-stages:
    get:
      operationId: listPipelineStages
      parameters:
        - $ref: '#/components/parameters/Limit'
